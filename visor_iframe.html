<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Visor de Planos</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#f0ede8;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#1a1a1a}

  #stage{position:absolute;inset:0;cursor:grab;touch-action:none;overflow:hidden}
  #stage.grab{cursor:grabbing}
  #world{position:absolute;left:0;top:0;transform-origin:0 0}
  #pdfCanvas{display:block;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.12)}
  #pins{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

  #ctl{position:fixed;right:14px;bottom:24px;display:flex;flex-direction:column;gap:8px;z-index:10}
  .btn{width:42px;height:42px;border-radius:10px;background:#fff;border:1px solid #d0cdc6;
    color:#444;font-size:20px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;-webkit-tap-highlight-color:transparent;
    box-shadow:0 1px 4px rgba(0,0,0,.08)}

  #pop{position:fixed;left:14px;bottom:90px;right:14px;z-index:10;
    background:#fff;border:1px solid #d0cdc6;border-radius:14px;
    box-shadow:0 8px 32px rgba(0,0,0,.12);opacity:0;pointer-events:none;
    transition:opacity .16s,transform .16s;transform:translateY(8px)}
  #pop.show{opacity:1;pointer-events:all;transform:translateY(0)}
  #pop-head{padding:13px 15px 10px;border-bottom:1px solid #e8e5e0;
    display:flex;align-items:center;justify-content:space-between}
  #pop-id{font-weight:700;font-size:14px;font-family:monospace;color:#1a1a1a}
  #pop-close{font-size:20px;cursor:pointer;color:#999;line-height:1;padding:2px 4px}
  #pop-body{padding:12px 15px;font-size:13px;line-height:1.8}
  #pop-body .row{display:flex;justify-content:space-between;
    border-bottom:1px dashed #e8e5e0;padding:4px 0}
  #pop-body .row:last-child{border-bottom:none}
  #pop-body .k{color:#999}
  #pop-body .v{font-weight:600;color:#1a1a1a}
  .st{padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
  .pop-actions{display:flex;gap:8px;margin-top:12px}
  .pop-btn{flex:1;padding:11px 8px;border:none;border-radius:10px;font-size:13px;
    font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;
    gap:6px;-webkit-tap-highlight-color:transparent}
  .btn-installed{background:#3ddc97;color:#0f1115}
  .btn-installed:active{background:#2fc882}
  .btn-issue{background:#ff6b6b;color:#fff}
  .btn-issue:active{background:#e05555}
  .btn-pending{background:#f0ede8;color:#555;border:1px solid #d0cdc6}
  .btn-pending:active{background:#e0ddd8}

  /* ── Action buttons (CO / RFI) ── */
  #action-btns{position:fixed;left:14px;bottom:24px;display:flex;flex-direction:column;
    gap:8px;z-index:10}
  .action-btn{padding:0 14px;height:42px;border-radius:10px;background:#fff;
    border:1px solid #d0cdc6;color:#444;font-size:12px;font-weight:600;
    cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;
    display:flex;align-items:center;gap:6px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .action-btn.active{background:#eff6ff;border-color:#5b9dff;color:#1a56db}
  .action-btn:active{opacity:.8}

  /* ── Context bar ── */
  #ctx-bar{position:fixed;bottom:0;left:0;right:0;z-index:15;
    background:#fff;border-top:1px solid #d0cdc6;
    padding:14px 16px 28px;display:none;flex-direction:column;gap:10px;
    box-shadow:0 -4px 20px rgba(0,0,0,.08)}
  #ctx-bar.show{display:flex}
  #ctx-title{font-size:13px;color:#666;text-align:center}
  #ctx-actions{display:flex;gap:8px}
  .ctx-btn{flex:1;padding:12px 8px;border:none;border-radius:10px;font-size:13px;
    font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;
    display:flex;align-items:center;justify-content:center;gap:6px}
  .ctx-btn-primary{background:#1a56db;color:#fff}
  .ctx-btn-secondary{background:#f0ede8;color:#1a1a1a;border:1px solid #d0cdc6}
  .ctx-btn-cancel{background:transparent;color:#999;border:1px solid #d0cdc6}
  .ctx-btn-confirm{background:#3ddc97;color:#0f1115}
  .ctx-btn-deny{background:#ff6b6b;color:#fff}

  /* ── Temp pin ── */
  .temp-pin{pointer-events:none}
  @keyframes tempPulse{
    0%  {opacity:.9;transform:scale(1)}
    50% {opacity:.5;transform:scale(1.3)}
    100%{opacity:.9;transform:scale(1)}
  }
  .temp-ring{animation:tempPulse 1.2s ease-in-out infinite}

  /* ── Select-item mode cursor ── */
  #stage.select-mode{cursor:crosshair}

  #loading{position:fixed;inset:0;background:#f0ede8;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:20;gap:14px}
  #loading p{color:#999;font-size:13px}
  .spinner{width:36px;height:36px;border:3px solid #d0cdc6;border-top-color:#1a56db;
    border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  #error{position:fixed;inset:0;background:#f0ede8;display:none;flex-direction:column;
    align-items:center;justify-content:center;z-index:20;gap:12px;padding:30px;text-align:center}
  #error h2{color:#ff6b6b;font-size:16px}
  #error p{color:#999;font-size:13px;line-height:1.6}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Cargando plano…</p></div>
<div id="msgtag" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:99;background:rgba(0,0,0,.75);color:#3ddc97;font-size:12px;font-family:monospace;padding:6px 12px;border-radius:6px;pointer-events:none;display:none"></div>
<div id="error"><h2>No se pudo cargar el plano</h2><p id="error-msg"></p></div>

<div id="stage">
  <div id="world">
    <canvas id="pdfCanvas"></canvas>
    <svg id="pins"></svg>
  </div>
</div>

<div id="ctl">
  <button class="btn" id="zin">+</button>
  <button class="btn" id="zout">−</button>
  <button class="btn" id="fit">⤢</button>
</div>

<div id="action-btns">
  <button class="action-btn" id="btn-co">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Change Order
  </button>
  <button class="action-btn" id="btn-rfi">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    RFI
  </button>
</div>

<!-- Context bar: shown during CO/RFI flow -->
<div id="ctx-bar">
  <div id="ctx-title"></div>
  <div id="ctx-actions"></div>
</div>

<div id="pop">
  <div id="pop-head">
    <span id="pop-id"></span>
    <span id="pop-close">×</span>
  </div>
  <div id="pop-body"></div>
</div>

<!-- WebSync for Bubble Mobile - WebView Web element -->
<script>
// WebSync Send Text function - comunica con Bubble Mobile via WebView Native
function wsSendText(text) {
  // Mostrar en pantalla lo que se envía a Bubble
  var tag = document.getElementById('msgtag');
  if(tag){ tag.textContent = text; tag.style.display='block'; setTimeout(function(){ tag.style.display='none'; }, 3000); }
  try {
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'text', value: text }));
    } else if (window.parent !== window) {
      window.parent.postMessage({type: 'text', value: text}, '*');
    }
  } catch(e) { console.log('WebSync send error:', e); }
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ─── Leer parámetros de la URL ──────────────────────────────────────────────
   Bubble arma la URI del iframe así:
   https://tu-sitio.com/visor.html?pdf=URL_DEL_PDF&devices=JSON_ENCODADO

   El JSON de devices debe estar encodeado con encodeURIComponent() en Bubble.
   Ejemplo de un dispositivo:
   [{"id":"CAM-101","t":"cam","x":262,"y":235,"room":"Oficina 101","ip":"10.0.1.11","st":"OK"}]

   Tipos válidos para "t":  cam | ap | sen | pan
   ─────────────────────────────────────────────────────────────────────────── */
var params  = new URLSearchParams(window.location.search);
var PDF_URL = params.get('pdf');
var MODE    = params.get('mode') || 'devices'; // 'devices' o 'cabling'
var DEVICES = [];

// Formato pipe: id|tipo|x|y|ambiente|statusDevice|statusCabling|category
// p[0]=id p[1]=tipo p[2]=x p[3]=y p[4]=ambiente p[5]=statusDevice p[6]=statusCabling p[7]=category
(function(){
  try {
    var full = window.location.href;
    var idx  = full.indexOf('&devices=');
    if(idx === -1) idx = full.indexOf('?devices=');
    if(idx === -1) return;
    var raw = full.substring(idx + 9);
    var nextParam = raw.indexOf('&mode=');
    if(nextParam !== -1) raw = raw.substring(0, nextParam);
    raw = decodeURIComponent(raw);
    if(!raw) return;
    DEVICES = raw.split('~').filter(Boolean).map(function(item){
      var p = item.split('|');
      return {
        id:           p[0] || '',
        t:            p[1] || '',
        x:            parseFloat(p[2]) || 0,
        y:            parseFloat(p[3]) || 0,
        room:         p[4] || '',
        statusDevice: p[5] || 'pending',
        statusCabling:p[6] || 'pending',
        category:     p[7] || ''
      };
    });
  } catch(e){ DEVICES = []; }
})();

/* ─── Status colors ─────────────────────────────────────────────────────── */
var STATUS_COLOR = {
  installed: '#3ddc97',
  pending:   '#ffb454',
  issue:     '#ff6b6b'
};
function getColor(st){
  if(!st) return STATUS_COLOR.pending;
  var k = st.toLowerCase().replace(/[^a-z]/g,'');
  if(k==='installed'||k==='instalado'||k==='ok') return STATUS_COLOR.installed;
  if(k==='issue'||k==='falla'||k==='error')      return STATUS_COLOR.issue;
  return STATUS_COLOR.pending;
}

/* ─── Iconos SVG por categoría y modo ──────────────────────────────────────
   Todos los paths están en un viewBox centrado en 0,0 escala ~11px
   ─────────────────────────────────────────────────────────────────────── */
var ICONS = {
  // Cámara (CCTV en modo devices)
  cctv_device:
    '<rect x="-9" y="-5" width="13" height="10" rx="2" fill="none" stroke="white" stroke-width="2"/>'+
    '<polyline points="4,-4 10,-7 10,7 4,4" fill="white" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>',

  // Wifi (WAP en modo devices)
  wap_device:
    '<path d="M-7,-2 Q0,-9 7,-2" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"/>'+
    '<path d="M-4,2 Q0,-3 4,2" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"/>'+
    '<circle cx="0" cy="5.5" r="1.5" fill="white"/>',

  // Puerta (AC - access control)
  ac_device:
    '<rect x="-5" y="-7" width="10" height="13" rx="1" fill="none" stroke="white" stroke-width="1.8"/>'+
    '<circle cx="3" cy="0" r="1.2" fill="white"/>',

  // Speaker (AV - audiovisual)
  av_device:
    '<rect x="-4" y="-5" width="5" height="10" rx="1" fill="none" stroke="white" stroke-width="1.8"/>'+
    '<path d="M3,-3 Q7,0 3,3" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"/>'+
    '<path d="M3,-6 Q10,0 3,6" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"/>',

  // Triángulo (CCTV, WAP, Data en modo cabling)
  triangle_cabling:
    '<polygon points="0,7 7,-6 -7,-6" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>',

  // Puerta cabling (AC)
  ac_cabling:
    '<rect x="-5" y="-7" width="10" height="13" rx="1" fill="none" stroke="white" stroke-width="1.8"/>'+
    '<circle cx="3" cy="0" r="1.2" fill="white"/>',

  // Speaker cabling (AV)
  av_cabling:
    '<rect x="-4" y="-5" width="5" height="10" rx="1" fill="none" stroke="white" stroke-width="1.8"/>'+
    '<path d="M3,-3 Q7,0 3,3" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"/>'+
    '<path d="M3,-6 Q10,0 3,6" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"/>',

  // CO y RFI: texto dentro del círculo
  co_icon:  '<text y="4" text-anchor="middle" font-size="8" font-weight="700" font-family="monospace" fill="white">CO</text>',
  rfi_icon: '<text y="4" text-anchor="middle" font-size="7" font-weight="700" font-family="monospace" fill="white">RFI</text>'
};

function getPinConfig(d){
  var cat = (d.category || '').toUpperCase();
  var mode = MODE;

  // CO y RFI se muestran en ambos modos sin popup
  if(cat === 'CO')  return {c: '#8b5cf6', icon: ICONS.co_icon,  label: 'Change Order', noPopup: true};
  if(cat === 'RFI') return {c: '#f59e0b', icon: ICONS.rfi_icon, label: 'RFI',          noPopup: true};

  if(mode === 'devices'){
    // Data no se muestra en modo devices
    if(cat === 'DATA') return null;
    var st = getColor(d.statusDevice);
    if(cat === 'CCTV') return {c: st, icon: ICONS.cctv_device,    label: 'CCTV'};
    if(cat === 'WAP')  return {c: st, icon: ICONS.wap_device,     label: 'WAP'};
    if(cat === 'AC')   return {c: st, icon: ICONS.ac_device,      label: 'Access Control'};
    if(cat === 'AV')   return {c: st, icon: ICONS.av_device,      label: 'Audiovisual'};
    return {c: st, icon: ICONS.cctv_device, label: cat};
  } else {
    var st = getColor(d.statusCabling);
    if(cat === 'CCTV') return {c: st, icon: ICONS.triangle_cabling, label: 'CCTV cabling'};
    if(cat === 'WAP')  return {c: st, icon: ICONS.triangle_cabling, label: 'WAP cabling'};
    if(cat === 'DATA') return {c: st, icon: ICONS.triangle_cabling, label: 'Data cabling'};
    if(cat === 'AC')   return {c: st, icon: ICONS.ac_cabling,       label: 'AC cabling'};
    if(cat === 'AV')   return {c: st, icon: ICONS.av_cabling,       label: 'AV cabling'};
    return {c: st, icon: ICONS.triangle_cabling, label: cat};
  }
}

/* ─── Estado del visor ───────────────────────────────────────────────────── */
var scale=1, baseScale=1, ox=0, oy=0;
var pdfW=0, pdfH=0, vbW=0, vbH=0;
var selected=null, pageViewport=null;

var stage  = document.getElementById('stage');
var world  = document.getElementById('world');
var svg    = document.getElementById('pins');
var pop    = document.getElementById('pop');
var loader = document.getElementById('loading');
var errDiv = document.getElementById('error');

/* ─── Cargar plano (PDF o imagen) ────────────────────────────────────────── */
function isImage(url){
  return /\.(jpe?g|png|webp|gif)(\?.*)?$/i.test(url.split('?')[0]);
}

var IS_IMAGE = false;

function loadImage(url){
  IS_IMAGE = true;
  var img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function(){
    // Límite seguro de canvas para iOS WebView (~16.7M px total y 4096 por lado)
    var MAX_SIDE = 4000;
    var natW = img.naturalWidth;
    var natH = img.naturalHeight;
    var renderScale = 1;
    if(natW > MAX_SIDE || natH > MAX_SIDE){
      renderScale = Math.min(MAX_SIDE/natW, MAX_SIDE/natH);
    }
    // viewBox usa el tamaño "lógico" (natural) para que las coordenadas de los pins no cambien
    vbW = natW;
    vbH = natH;
    // El canvas físico se dibuja a la resolución capada
    pdfW = Math.round(natW * renderScale);
    pdfH = Math.round(natH * renderScale);

    var cv = document.getElementById('pdfCanvas');
    cv.width  = pdfW;
    cv.height = pdfH;
    cv.getContext('2d').drawImage(img, 0, 0, pdfW, pdfH);
    svg.setAttribute('width',  pdfW);
    svg.setAttribute('height', pdfH);
    svg.setAttribute('viewBox','0 0 '+vbW+' '+vbH);
    drawPins();
    fit();
    loader.style.display = 'none';
  };
  img.onerror = function(){
    showError('No se pudo cargar la imagen.', 'Verificá que la URL sea pública y accesible.');
  };
  img.src = url;
}

function loadPDF(url){
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdfjsLib.getDocument(url).promise
    .then(function(pdf){ return pdf.getPage(1); })
    .then(function(page){
      // Tamaño base de la página (a escala 1)
      var base = page.getViewport({scale: 1});
      var RENDER = 1.8;
      // Limitar para no exceder el canvas máximo de iOS WebView
      var MAX_SIDE = 4000;
      var projW = base.width * RENDER;
      var projH = base.height * RENDER;
      if(projW > MAX_SIDE || projH > MAX_SIDE){
        RENDER = RENDER * Math.min(MAX_SIDE/projW, MAX_SIDE/projH);
      }
      pageViewport = page.getViewport({scale: RENDER});
      pdfW = pageViewport.width;
      pdfH = pageViewport.height;
      vbW  = pageViewport.viewBox[2];
      vbH  = pageViewport.viewBox[3];
      var cv = document.getElementById('pdfCanvas');
      cv.width  = pdfW;
      cv.height = pdfH;
      svg.setAttribute('width',  pdfW);
      svg.setAttribute('height', pdfH);
      svg.setAttribute('viewBox','0 0 '+vbW+' '+vbH);
      return page.render({canvasContext: cv.getContext('2d'), viewport: pageViewport}).promise;
    })
    .then(function(){
      drawPins();
      fit();
      loader.style.display = 'none';
    })
    .catch(function(e){
      showError('No se pudo renderizar el PDF.', e.message || 'Verificá que la URL sea pública y accesible.');
    });
}

if(!PDF_URL){
  showError('No se recibió la URL del plano.','Revisá que el parámetro "pdf" esté en la URI del iframe de Bubble.');
} else {
  if(isImage(PDF_URL)){
    loadImage(PDF_URL);
  } else {
    loadPDF(PDF_URL);
  }
}

/* ─── Pins ───────────────────────────────────────────────────────────────── */
function drawPins(){
  DEVICES.forEach(function(d){
    var cfg = getPinConfig(d);
    if(!cfg) return; // omitir si no se muestra en este modo
    var yy  = IS_IMAGE ? d.y : (vbH - d.y);
    var g   = document.createElementNS(svg.namespaceURI,'g');
    g.setAttribute('transform','translate('+d.x+','+yy+')');
    g.style.cursor = 'pointer';
    g.style.pointerEvents = 'all';
    g.dataset.id = d.id;
    g.innerHTML =
      '<circle r="20" fill="transparent"/>'+
      '<circle r="11" fill="'+cfg.c+'"/>'+
      cfg.icon;
    var lastTap = 0;
    g.addEventListener('click', function(e){
      e.stopPropagation();
      if(cfg.noPopup) return; // CO y RFI no abren popup
      var now = Date.now();
      if(now - lastTap < 350){ selectPin(d.id, true); }
      lastTap = now;
    });
    svg.appendChild(g);
  });
}

function rescalePins(){
  var inv = 1/scale;
  svg.querySelectorAll('g[data-id]').forEach(function(p){
    var m = p.getAttribute('transform').match(/translate\(([^,]+),([^)]+)\)/);
    if(m) p.setAttribute('transform','translate('+m[1]+','+m[2]+') scale('+inv+')');
  });
}

/* ─── Transform ──────────────────────────────────────────────────────────── */
function apply(){
  world.style.transform = 'translate('+ox+'px,'+oy+'px) scale('+scale+')';
  rescalePins();
  if(selected) placePopup();
}

function fit(){
  var r = stage.getBoundingClientRect(), pad = 40;
  baseScale = Math.min((r.width-pad)/pdfW, (r.height-pad)/pdfH);
  scale = baseScale;
  ox = (r.width  - pdfW*scale)/2;
  oy = (r.height - pdfH*scale)/2;
  apply();
}

function zoomAt(cx,cy,f){
  var nx = scale*f;
  if(nx < baseScale*0.4 || nx > baseScale*14) return;
  ox = cx-(cx-ox)*f; oy = cy-(cy-oy)*f; scale = nx; apply();
}

/* ─── Eventos de navegación ─────────────────────────────────────────────── */
stage.addEventListener('wheel', function(e){
  e.preventDefault();
  var r = stage.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.12:1/1.12);
},{passive:false});

// Paneo — solo activa si se movio mas de 6px (distingue tap de paneo)
var drag = null, didMove = false;
stage.addEventListener('pointerdown', function(e){
  drag = {x:e.clientX, y:e.clientY, ox:ox, oy:oy};
  didMove = false;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', function(e){
  if(!drag) return;
  var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!didMove && Math.hypot(dx,dy) < 6) return;
  didMove = true;
  stage.classList.add('grab');
  ox = drag.ox+dx; oy = drag.oy+dy; apply();
});
stage.addEventListener('pointerup', function(){
  drag=null; stage.classList.remove('grab');
});
stage.addEventListener('click', function(e){
  if(e.target===stage||e.target===world||e.target.id==='pdfCanvas') deselect();
});

// Pinch-to-zoom táctil
var t0=null, d0=0, ox0=0, oy0=0, s0=0;
stage.addEventListener('touchstart', function(e){
  if(e.touches.length===2){
    e.preventDefault();

    var t=e.touches;
    t0={x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2};
    d0=Math.hypot(t[1].clientX-t[0].clientX, t[1].clientY-t[0].clientY);
    ox0=ox; oy0=oy; s0=scale;
  }
},{passive:false});
stage.addEventListener('touchend', function(e){
  if(t0 !== null && e.touches.length < 2) t0 = null;
});
stage.addEventListener('touchcancel', function(e){
  t0 = null;
});

stage.addEventListener('touchmove', function(e){
  if(e.touches.length===2 && t0){
    e.preventDefault();
    var t=e.touches;
    var d=Math.hypot(t[1].clientX-t[0].clientX, t[1].clientY-t[0].clientY);
    var f=d/d0, ns=Math.max(baseScale*0.4,Math.min(s0*f,baseScale*14));
    var cx=(t[0].clientX+t[1].clientX)/2, cy=(t[0].clientY+t[1].clientY)/2;
    ox=cx-(t0.x-ox0)*ns/s0-(cx-t0.x); oy=cy-(t0.y-oy0)*ns/s0-(cy-t0.y);
    scale=ns; apply();
  }
},{passive:false});

// Botones
document.getElementById('zin').onclick  = function(){ var r=stage.getBoundingClientRect(); zoomAt(r.width/2,r.height/2,1.25); };
document.getElementById('zout').onclick = function(){ var r=stage.getBoundingClientRect(); zoomAt(r.width/2,r.height/2,1/1.25); };
document.getElementById('fit').onclick  = fit;

/* ─── Popup ──────────────────────────────────────────────────────────────── */
function selectPin(id, center){
  selected = id;
  var d = DEVICES.filter(function(x){ return x.id===id; })[0];
  if(!d) return;
  if(center){
    var sx=d.x/vbW*pdfW, sy=IS_IMAGE ? d.y/vbH*pdfH : (vbH-d.y)/vbH*pdfH;
    var r=stage.getBoundingClientRect();
    ox=r.width/2-sx*scale; oy=r.height*0.38-sy*scale; apply();
  }
  var cfg = getPinConfig(d);
  var currentStatus = MODE === 'devices' ? d.statusDevice : d.statusCabling;
  document.getElementById('pop-id').textContent = d.id;
  // Contenido fijo del popup
  var popHtml =
    row('Categoría',  (cfg ? cfg.label : d.category)||'—')+
    row('Ubicación',  d.room||'—')+
    rowSt('Estado',   currentStatus||'—');
  document.getElementById('pop-body').innerHTML = popHtml;

  // Botones dinámicos según status
  var st = (currentStatus||'').toLowerCase().replace(/[^a-z]/g,'');
  var svgCheck = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var svgIssue = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
  var svgBack  = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><line x1="4" y1="9" x2="20" y2="9"/></svg>';
  var btns = [];
  if(st === 'pending' || st === ''){
    btns.push({cls:'btn-installed', icon:svgCheck, label:'Installed', action:'installed'});
    btns.push({cls:'btn-issue',     icon:svgIssue, label:'Issue',     action:'issue'});
  } else if(st === 'installed'){
    btns.push({cls:'btn-pending', icon:svgBack,  label:'Pending', action:'pending'});
    btns.push({cls:'btn-issue',   icon:svgIssue, label:'Issue',   action:'issue'});
  } else if(st === 'issue'){
    btns.push({cls:'btn-installed', icon:svgCheck, label:'Installed', action:'installed'});
    btns.push({cls:'btn-pending',   icon:svgBack,  label:'Pending',   action:'pending'});
  }
  var html = '<div class="pop-actions">';
  btns.forEach(function(b){
    html += '<button class="pop-btn '+b.cls+'" data-action="'+b.action+'">'+b.icon+b.label+'</button>';
  });
  html += '</div>';
  document.getElementById('pop-body').innerHTML += html;
  document.querySelectorAll('.pop-btn[data-action]').forEach(function(btn){
    btn.addEventListener('click', function(){
      wsSendText(d.id + '|' + this.dataset.action);
    });
  });
  pop.classList.add('show');
}
function row(k,v){ return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }
function rowSt(k,v){
  var c = STATUS_COLOR.pending;
  if(!v) { v = '—'; }
  else {
    var k2 = v.toLowerCase().replace(/[^a-z]/g,'');
    if(k2==='installed'||k2==='instalado'||k2==='ok') c = STATUS_COLOR.installed;
    else if(k2==='issue'||k2==='falla'||k2==='error') c = STATUS_COLOR.issue;
  }
  return '<div class="row"><span class="k">'+k+'</span>'+
         '<span class="v"><span class="st" style="background:'+c+'22;color:'+c+'">'+v+'</span></span></div>';
}

function placePopup(){ /* en mobile el popup es fijo (fixed bottom), no necesita reposicionarse */ }
function deselect(){ selected=null; pop.classList.remove('show'); }
document.getElementById('pop-close').onclick = deselect;

window.addEventListener('resize', fit);

/* ─── Helpers ────────────────────────────────────────────────────────────── */
function showError(title, msg){
  loader.style.display='none';
  errDiv.style.display='flex';
  errDiv.querySelector('h2').textContent=title;
  document.getElementById('error-msg').textContent=msg;
}

/* ─── Change Order / RFI flow ───────────────────────────────────────────── */
var activeFlow = null;
var flowStep   = null;
var tempPinEl  = null;
var tempCoords = null;
var ctxBar     = document.getElementById('ctx-bar');
var ctxTitle   = document.getElementById('ctx-title');
var ctxActions = document.getElementById('ctx-actions');
var stageTap   = 0;

function flowLabel(){ return activeFlow === 'co' ? 'Change Order' : 'RFI'; }

function setCtx(title, btns){
  ctxTitle.textContent = title;
  ctxActions.innerHTML = '';
  btns.forEach(function(b){
    var el = document.createElement('button');
    el.className = 'ctx-btn ' + b.cls;
    el.innerHTML = (b.icon||'') + b.label;
    el.onclick = b.fn;
    ctxActions.appendChild(el);
  });
  ctxBar.classList.add('show');
}

function cancelFlow(){
  activeFlow = null; flowStep = null;
  ctxBar.classList.remove('show');
  stage.classList.remove('select-mode');
  showPins();
  removeTempPin();
  document.getElementById('btn-co').classList.remove('active');
  document.getElementById('btn-rfi').classList.remove('active');
}

function startFlow(type){
  if(activeFlow === type){ cancelFlow(); return; }
  activeFlow = type; flowStep = 'choose';
  deselect();
  document.getElementById('btn-co').classList.toggle('active', type==='co');
  document.getElementById('btn-rfi').classList.toggle('active', type==='rfi');
  setCtx('Crear ' + flowLabel() + ' sobre:', [
    {cls:'ctx-btn-primary',   label:'Un dispositivo', fn: startSelectItem},
    {cls:'ctx-btn-secondary', label:'Una ubicación',  fn: startSelectLocation},
    {cls:'ctx-btn-cancel',    label:'Cancelar',        fn: cancelFlow}
  ]);
}

function startSelectItem(){
  flowStep = 'select-item';
  stage.classList.add('select-mode');
  setCtx('Tocá el dispositivo', [
    {cls:'ctx-btn-cancel', label:'Cancelar', fn: cancelFlow}
  ]);
}

function onItemSelected(deviceId){
  if(flowStep !== 'select-item') return;
  stage.classList.remove('select-mode');
  setCtx(deviceId + '  —  ¿Confirmar ' + flowLabel() + '?', [
    {cls:'ctx-btn-confirm', label:'✓ Confirmar', fn: function(){
      wsSendText(deviceId + '|' + activeFlow);
      cancelFlow();
    }},
    {cls:'ctx-btn-cancel', label:'Cancelar', fn: cancelFlow}
  ]);
}

function startSelectLocation(){
  flowStep = 'select-location';
  hidePins();
  setCtx('Doble tap para marcar la ubicación', [
    {cls:'ctx-btn-cancel', label:'Cancelar', fn: cancelFlow}
  ]);
}

function onLocationSelected(x, y){
  if(flowStep !== 'select-location') return;
  flowStep = 'confirm-location';
  tempCoords = {x:x, y:y};
  placeTempPin(x, y);
  setCtx('¿Confirmar esta ubicación?', [
    {cls:'ctx-btn-confirm', label:'✓ Sí', fn: function(){
      wsSendText(tempCoords.x + '|' + tempCoords.y + '|' + activeFlow);
      cancelFlow();
    }},
    {cls:'ctx-btn-deny', label:'✕ No', fn: function(){
      removeTempPin();
      flowStep = 'select-location';
      setCtx('Doble tap para marcar la ubicación', [
        {cls:'ctx-btn-cancel', label:'Cancelar', fn: cancelFlow}
      ]);
    }}
  ]);
}

function hidePins(){ document.getElementById('pins').style.opacity='0'; }
function showPins(){ document.getElementById('pins').style.opacity='1'; }

function placeTempPin(x, y){
  removeTempPin();
  var pinsEl = document.getElementById('pins');
  var yy = IS_IMAGE ? y : (vbH - y);
  var g  = document.createElementNS(pinsEl.namespaceURI, 'g');
  g.setAttribute('class','temp-pin');
  g.setAttribute('transform','translate('+x+','+yy+')');
  g.innerHTML =
    '<circle class="temp-ring" r="18" fill="#5b9dff" fill-opacity=".25" stroke="#5b9dff" stroke-width="2"/>'+
    '<circle r="8" fill="#5b9dff"/>';
  pinsEl.appendChild(g);
  pinsEl.style.opacity = '1';
  tempPinEl = g;
  rescalePins();
}

function removeTempPin(){
  if(tempPinEl && tempPinEl.parentNode){ tempPinEl.parentNode.removeChild(tempPinEl); }
  tempPinEl = null;
}

// Double tap on stage for location
stage.addEventListener('click', function(e){
  if(flowStep === 'select-location'){
    var now = Date.now();
    if(now - stageTap < 350){
      var r  = stage.getBoundingClientRect();
      var px = (e.clientX - r.left - ox) / scale;
      var py = (e.clientY - r.top  - oy) / scale;
      var cx = Math.round(px / pdfW * vbW);
      var cy = IS_IMAGE ? Math.round(py / pdfH * vbH) : Math.round((1 - py/pdfH) * vbH);
      onLocationSelected(cx, cy);
    }
    stageTap = now;
    return;
  }
  stageTap = 0;
  var world = document.getElementById('world');
  if(e.target===stage||e.target===world||e.target.id==='pdfCanvas') deselect();
}, true);

// Pin click override in select-item mode
document.getElementById('pins').addEventListener('click', function(e){
  if(flowStep !== 'select-item') return;
  var t = e.target;
  var g = null;
  while(t && t !== document.getElementById('pins')){
    if(t.dataset && t.dataset.id){ g = t; break; }
    t = t.parentElement;
  }
  if(g){ e.stopPropagation(); onItemSelected(g.dataset.id); }
}, true);

document.getElementById('btn-co').onclick  = function(){ startFlow('co'); };
document.getElementById('btn-rfi').onclick = function(){ startFlow('rfi'); };
</script>
